<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc"><title id="title">Problem 7: SIXT + TUM marking scheme</title><desc id="desc">A 100-point base grade comprises 65 dataset points and 35 judging points. Public and final dataset accuracy are weighted 35 and 65 percent within the dataset component. Verified qualifying small-model use earns 15 extra points, for a maximum of 115. Example base 84.225 plus bonus 15 equals 99.225.</desc><rect x="0" y="0" width="1800" height="1180" rx="0" fill="#fafcfd" stroke="#fafcfd" stroke-width="2"/><rect x="60" y="42" width="115" height="7" rx="3" fill="#ff8c37" stroke="#ff8c37" stroke-width="2"/><rect x="185" y="42" width="1555" height="7" rx="3" fill="#286384" stroke="#286384" stroke-width="2"/><text x="60" y="93" text-anchor="start" fill="#286384" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">PROBLEM 7  /  SIXT + TUM</text><text x="60" y="151" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700">How your score is calculated</text><text x="60" y="191" text-anchor="start" fill="#526976" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400">A 100-point base grade, plus 15 extra points for a verified small-model workflow. Maximum: 115.</text><rect x="60" y="240" width="970" height="121" rx="18" fill="#e7f1f8" stroke="#286384" stroke-width="2"/><text x="88" y="284" text-anchor="start" fill="#286384" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">DATASET RESULTS</text><text x="88" y="332" text-anchor="start" fill="#286384" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700">65 points</text><text x="370" y="290" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Automatic comparison of your answer CSVs</text><text x="370" y="330" text-anchor="start" fill="#526976" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">400 scored questions across two separate stages</text><rect x="1050" y="240" width="690" height="121" rx="18" fill="#eeeaf8" stroke="#65528a" stroke-width="2"/><text x="1078" y="284" text-anchor="start" fill="#65528a" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">HUMAN JUDGING</text><text x="1078" y="332" text-anchor="start" fill="#65528a" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700">35 points</text><text x="1305" y="289" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">Five criteria from the</text><text x="1305" y="323" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">event judging rubric</text><rect x="60" y="386" width="970" height="352" rx="18" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="88" y="429" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">1. Calculate the dataset component</text><rect x="88" y="455" width="427" height="111" rx="13" fill="#e7f1f8" stroke="#e7f1f8" stroke-width="2"/><text x="112" y="489" text-anchor="start" fill="#286384" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">PUBLIC ACCURACY  P</text><text x="112" y="532" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">100 x public correct / 200</text><rect x="541" y="455" width="461" height="111" rx="13" fill="#eeeaf8" stroke="#eeeaf8" stroke-width="2"/><text x="565" y="489" text-anchor="start" fill="#65528a" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">FINAL ACCURACY  F</text><text x="565" y="532" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">100 x final correct / 200</text><text x="88" y="611" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Dataset score  D = 0.35P + 0.65F</text><text x="88" y="656" text-anchor="start" fill="#286384" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Dataset points = 0.65D</text><text x="88" y="705" text-anchor="start" fill="#526976" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">Public answers can earn 22.75 points; final answers can earn 42.25.</text><rect x="1050" y="386" width="690" height="352" rx="18" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="1078" y="429" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">2. Add judging and any bonus</text><text x="1078" y="484" text-anchor="start" fill="#65528a" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">J = (35 / 75) x raw rubric points</text><text x="1078" y="531" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Base grade = 0.65D + J</text><rect x="1078" y="560" width="634" height="139" rx="13" fill="#fff1cd" stroke="#dfc98f" stroke-width="2"/><text x="1104" y="600" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Final total = base grade + bonus</text><text x="1104" y="642" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">Bonus = 15 if eligible; otherwise 0.</text><text x="1104" y="674" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">An eligible team can score up to 115 points.</text><rect x="60" y="765" width="970" height="331" rx="18" fill="#e3f0eb" stroke="#b9d5c8" stroke-width="2"/><text x="88" y="811" text-anchor="start" fill="#24715b" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">3. Qualify for the small-model bonus</text><text x="88" y="855" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">Use qualifying models substantively in your challenge workflow.</text><text x="88" y="887" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">Every generative model used for method/code, answers or validation</text><text x="88" y="919" text-anchor="start" fill="#193747" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">must have at most 40 billion total parameters, including fallbacks.</text><path d="M88,940 L1002,940" fill="none" stroke="#b9d5c8" stroke-width="1.5" stroke-linecap="round"/><text x="88" y="976" text-anchor="start" fill="#526976" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400">Count all MoE experts. Quantization does not reduce parameter count.</text><text x="88" y="1008" text-anchor="start" fill="#526976" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400">Submit exact model IDs, parameter evidence and usage logs.</text><text x="88" y="1040" text-anchor="start" fill="#526976" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400">Larger or undisclosed-size models can still earn the 100 base points.</text><rect x="1050" y="765" width="690" height="331" rx="18" fill="#193747" stroke="#193747" stroke-width="2"/><text x="1078" y="811" text-anchor="start" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">WORKED GRADING EXAMPLE</text><text x="1078" y="849" text-anchor="start" fill="#dce8ee" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">160/200 public + 180/200 final correct</text><text x="1078" y="878" text-anchor="start" fill="#dce8ee" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">P = 80; F = 90; D = 86.5</text><text x="1078" y="907" text-anchor="start" fill="#dce8ee" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">Dataset points = 56.225</text><text x="1078" y="936" text-anchor="start" fill="#dce8ee" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">Judging: 60 / 75 -&gt; 28 points</text><path d="M1078,953 L1712,953" fill="none" stroke="#718691" stroke-width="1.5" stroke-linecap="round"/><text x="1078" y="985" text-anchor="start" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Base: 84.225</text><text x="1078" y="1033" text-anchor="start" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">With bonus: 99.225 points</text><text x="1078" y="1070" text-anchor="start" fill="#dce8ee" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Scores are ranked before display rounding.</text><text x="60" y="1141" text-anchor="start" fill="#526976" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400">The +15 replaces the event&#x27;s general +5 bonus. Add it once; maximum total = 115 points (no cap at 100).</text></svg>